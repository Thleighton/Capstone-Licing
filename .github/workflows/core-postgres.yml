name: Core PostgreSQL
on:
  pull_request:
    paths:
      - 'licing/backend/licing-core/**'
      - '.github/workflows/core-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'licing/backend/licing-core/**'
      - '.github/workflows/core-postgres.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: licing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: licing/backend/licing-core
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/licing_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/licing_test
      MP_TICKET: test-sin-acceso-real
      MP_PAUSA_DETALLES_SEGUNDOS: '0.001'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: psql "$TEST_DATABASE_URL_SQL" -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
        env:
          TEST_DATABASE_URL_SQL: postgresql://postgres:test@localhost:5432/licing_test
      - run: python -m alembic upgrade head
      - run: python -m pytest -q --tb=short
