services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env          # <--- Esto carga automáticamente todo el .env al backend
    environment:
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
    command: ["sh", "-c", "cd backend/licing-core && alembic upgrade head && cd /app && exec uvicorn api.index:app --host 0.0.0.0 --port 8000 --reload"]

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/frontend/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_USE_POLLING=true
    command: sh -c "npm install && npm run dev -- --host"
