services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env          # <--- Esto carga automáticamente todo el .env al backend
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/frontend/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_USE_POLLING=true
    command: sh -c "npm install && npm run dev -- --host"