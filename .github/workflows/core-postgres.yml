name: Core PostgreSQL
on:
  pull_request:
    paths:
      - 'licing/backend/licing-core/**'
      - 'licing/filtradas/**'
      - 'licing/frontend/**'
      - 'licing/api/**'
      - 'licing/requirements.txt'
      - 'licing/vercel.json'
      - 'licing/.python-version'
      - 'licing/.vercelignore'
      - '.github/workflows/core-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'licing/backend/licing-core/**'
      - 'licing/filtradas/**'
      - 'licing/frontend/**'
      - 'licing/api/**'
      - 'licing/requirements.txt'
      - 'licing/vercel.json'
      - 'licing/.python-version'
      - 'licing/.vercelignore'
      - '.github/workflows/core-postgres.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: licing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: licing/backend/licing-core
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/licing_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/licing_test
      MP_TICKET: test-sin-acceso-real
      MP_PAUSA_DETALLES_SEGUNDOS: '0.001'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: licing/backend/licing-core/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: psql "$TEST_DATABASE_URL_SQL" -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
        env:
          TEST_DATABASE_URL_SQL: postgresql://postgres:test@localhost:5432/licing_test
      - run: python -m alembic upgrade head
      - run: python -m pytest -q --tb=short

  filtradas_y_frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            licing/filtradas/package-lock.json
            licing/frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm test
        working-directory: licing/filtradas
      - run: npm ci --ignore-scripts && npm test && npm run build
        working-directory: licing/frontend
